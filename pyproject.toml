[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smogzilla"
version = "0.1.0"
description = "Telegram bot for real-time air quality in Italian cities"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "tenacity>=9",
    "pandas>=3",
    "python-dotenv>=1",
    "python-telegram-bot>=22",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
]

[tool.setuptools]
py-modules = ["bot", "config", "formatter", "wsgi"]

[tool.setuptools.packages.find]
include = ["scrapers*", "handlers*", "utils*"]
exclude = ["tests*", "notebooks*"]
